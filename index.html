<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Drafting Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .mannequin-line { stroke: #10B981; stroke-width: 3; stroke-linecap: round; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

  <div class="max-w-6xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-light">Draft Your Basic Block</h1>
      <p class="text-sm text-gray-500 mt-2 max-w-xl mx-auto">
        Input your measurements to dynamically plot and export a scaled 2D bodice pattern.
      </p>
    </header>

    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-8 border">
      <div class="flex gap-2">
        <button id="btn-cm" onclick="setUnit('cm')" class="px-4 py-1.5 text-sm font-semibold rounded bg-black text-white">cm</button>
        <button id="btn-inch" onclick="setUnit('inch')" class="px-4 py-1.5 text-sm font-semibold rounded bg-gray-100 text-gray-700">inch</button>
      </div>
      <div class="font-medium text-sm text-gray-600">Bodice Pattern Engine</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      
      <div class="bg-white border rounded-xl p-5 shadow-sm flex flex-col justify-between">
        <div>
          <h2 class="text-xs font-bold tracking-wider text-gray-500 uppercase">Bust Circumference</h2>
          <div class="mt-4 space-y-3">
            <div class="flex justify-between items-center">
              <label class="text-sm font-medium">Circumference</label>
              <div class="flex items-center gap-1">
                <input type="number" id="bust-circ" value="88" oninput="drawPattern()" class="w-20 border rounded px-2 py-1 text-right text-sm">
                <span class="unit-label text-xs text-gray-500">cm</span>
              </div>
            </div>
            <div class="flex justify-between items-center">
              <label class="text-sm font-medium text-gray-600">Ease at bust</label>
              <div class="flex items-center gap-1">
                <input type="number" id="bust-ease" value="8" oninput="drawPattern()" class="w-20 border rounded px-2 py-1 text-right text-sm bg-gray-50">
                <span class="unit-label text-xs text-gray-500">cm</span>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-6 border-t pt-4 flex justify-center">
          <svg width="100" height="120" viewBox="0 0 100 120" class="bg-gray-50 rounded">
            <path d="M35 20 C40 25 60 25 65 20 L80 35 L75 55 L70 100 L30 100 L25 55 L20 35 Z" fill="#E5E7EB" stroke="#D1D5DB"/>
            <line x1="22" y1="45" x2="78" y2="45" class="mannequin-line" />
          </svg>
        </div>
      </div>

      <div class="bg-white border rounded-xl p-5 shadow-sm flex flex-col justify-between">
        <div>
          <h2 class="text-xs font-bold tracking-wider text-gray-500 uppercase">Waist Circumference</h2>
          <div class="mt-4 space-y-3">
            <div class="flex justify-between items-center">
              <label class="text-sm font-medium">Circumference</label>
              <div class="flex items-center gap-1">
                <input type="number" id="waist-circ" value="70" oninput="drawPattern()" class="w-20 border rounded px-2 py-1 text-right text-sm">
                <span class="unit-label text-xs text-gray-500">cm</span>
              </div>
            </div>
            <div class="flex justify-between items-center">
              <label class="text-sm font-medium text-gray-600">Ease at waist</label>
              <div class="flex items-center gap-1">
                <input type="number" id="waist-ease" value="4" oninput="drawPattern()" class="w-20 border rounded px-2 py-1 text-right text-sm bg-gray-50">
                <span class="unit-label text-xs text-gray-500">cm</span>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-6 border-t pt-4 flex justify-center">
          <svg width="100" height="120" viewBox="0 0 100 120" class="bg-gray-50 rounded">
            <path d="M35 20 C40 25 60 25 65 20 L80 35 L75 55 L70 100 L30 100 L25 55 L20 35 Z" fill="#E5E7EB" stroke="#D1D5DB"/>
            <line x1="28" y1="75" x2="72" y2="75" class="mannequin-line" />
          </svg>
        </div>
      </div>

      <div class="bg-white border rounded-xl p-5 shadow-sm flex flex-col justify-between">
        <div>
          <h2 class="text-xs font-bold tracking-wider text-gray-500 uppercase">Shoulder–Waist Length</h2>
          <div class="mt-4 space-y-3">
            <div class="flex justify-between items-center">
              <label class="text-sm font-medium">Length</label>
              <div class="flex items-center gap-1">
                <input type="number" id="shoulder-waist" value="42" oninput="drawPattern()" class="w-20 border rounded px-2 py-1 text-right text-sm">
                <span class="unit-label text-xs text-gray-500">cm</span>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-6 border-t pt-4 flex justify-center">
          <svg width="100" height="120" viewBox="0 0 100 120" class="bg-gray-50 rounded">
            <path d="M35 20 C40 25 60 25 65 20 L80 35 L75 55 L70 100 L30 100 L25 55 L20 35 Z" fill="#E5E7EB" stroke="#D1D5DB"/>
            <line x1="38" y1="22" x2="38" y2="75" class="mannequin-line" />
          </svg>
        </div>
      </div>

    </div>

    <div class="bg-white border rounded-xl p-6 shadow-sm mb-8 text-center">
      <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">Generated 2D Pattern Draft</h3>
      <div class="overflow-auto border bg-gray-50 rounded-lg p-4 flex justify-center">
        <svg id="pattern-canvas" width="400" height="500" viewBox="0 0 400 500" class="bg-white border shadow-inner">
          </svg>
      </div>
      <button onclick="downloadSVG()" class="mt-4 bg-black text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-gray-800">
        Download Pattern (.SVG)
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
